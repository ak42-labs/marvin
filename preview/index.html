<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Marvin – Gesichter-Vorschau</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Press+Start+2P&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../face.css">
<link rel="stylesheet" href="preview.css">
</head>
<body class="pv">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</svg>
<h1>GESICHTER-VORSCHAU</h1>
<p class="hint">Echter Gesicht-Code. Die App bleibt unverändert. Orange umrandet = neu.</p>
<div class="grp"><b>Start</b>
  <button class="new" data-start="2500">Start (Laden 2,5 s)</button>
  <button class="new" data-start="8000">Start (langsames Netz)</button>
</div>
<div class="grp"><b>Runde Welt</b>
  <button class="new" data-p="look">Schauen</button>
  <button data-p="sleep">Schlafen</button>
  <button data-p="curious">Neugier</button>
  <button data-p="roll">Augenrollen</button>
  <button data-p="blink">Blinzeln</button>
</div>
<div class="grp"><b>Tore</b>
  <button class="new" data-p="gate-crt">Röhre an</button>
  <button data-p="gate-morph">Verwandlung</button>
  <button data-p="gate-rain">Blockregen</button>
  <button data-p="gate-snake">Snake-Tor</button>
  <button class="new" data-p="gate-over">Game Over → rund</button>
</div>
<div class="grp"><b>Pixel-Welt</b>
  <button class="new" data-p="bricks">Ballspiel</button>
  <button data-p="wave">La-Ola</button>
  <button data-p="wink">Zwinkern</button>
</div>
<div class="grp"><b>Ereignisse</b>
  <button data-r="done">Erledigt</button>
  <button data-r="move">Verschieben</button>
  <button class="new" data-r="del">Löschen</button>
  <button data-auto>Autopilot an</button>
</div>
<div id="say"></div>
<div id="stat"></div>
<div class="spacer"></div>
<button id="marvin-btn" class="glass pill doze" aria-label="Marvin">
  <svg class="grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#noise)"/></svg>
  <div class="sheen"></div>
</button>
<script src="face.js"></script>
<script>
const q = new URLSearchParams(location.search);
const sayEl = document.getElementById('say');
let sayT;
Face.init({
  say: t => { sayEl.textContent = t; clearTimeout(sayT); sayT = setTimeout(() => sayEl.textContent = '', 4000); },
  soundOn: () => q.get('ton') === '1',
  canIdle: () => q.has('auto'),
});
// Start: Laden läuft so lange wie angegeben
Face.sync(true);
setTimeout(() => Face.sync(false), Number(q.get('load') || 2500));
document.querySelectorAll('[data-start]').forEach(b => b.onclick = () => { q.set('load', b.dataset.start); q.delete('auto'); location.search = q; });
document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => Face._play(b.dataset.p));
document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => Face.react(b.dataset.r, { hyperspaceEmpty: false }));
document.querySelector('[data-auto]').onclick = () => { q.set('auto', '1'); location.search = q; };
setInterval(() => { const s = Face._state(); document.getElementById('stat').textContent = `${s.world} · ${s.running || '—'}`; }, 300);
</script>
</body>
</html>
